name: CI

# Typecheck and test on every push and PR. The tests include the determinism guard
# (no wall-clock time or Math.random in packages/*/src), the fixture secret check and the
# report drift check. The HTML validation reports are attached as an artifact.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generate the validation reports
        run: pnpm -s vks report --all
      - name: Attach the HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: docs/workstreams/v1-standalone-sensor/reports/*.html
          if-no-files-found: error
      - name: No API key in committed files
        run: |
          if git grep -nE 'key=[A-Za-z0-9_-]{16,}' -- ':!.github/**'; then
            echo "::error::A committed file contains what looks like an API key."
            exit 1
          fi
